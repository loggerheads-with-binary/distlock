name: Coverage
# Rust coverage only. Python coverage is measured inside the ci.yml python job (ubuntu, 3.13), so
# that tests are not built and run twice. This one stays separate: an instrumented build cannot reuse
# the plain test build, and a coverage problem must never block a release (which reuses ci.yml).
# One-time setup: add the repo to codecov.io and store its upload token as the secret CODECOV_TOKEN.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    name: rust coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: Install htpasswd (the tests make bcrypt hashes with it)
        run: sudo apt-get update && sudo apt-get install -y apache2-utils
      - run: cargo llvm-cov nextest --workspace --locked --lcov --output-path lcov.info
      - name: Summary
        run: cargo llvm-cov report >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
