name: Release

# Publishes to crates.io and PyPI when a version tag (v1.2.3) is pushed.
#
#   git tag v0.2.0 && git push origin v0.2.0      (after bumping every version; see BUILD.md)
#
# One-time setup:
#   * repository secret CARGO_REGISTRY_TOKEN (a crates.io API token that may publish these crates)
#   * PyPI "trusted publisher" for this repo: workflow release.yml, environment "pypi"
#     (https://docs.pypi.org/trusted-publishers/); no PyPI token is stored anywhere.
#   * GitHub environments "crates-io" and "pypi" (add required reviewers there if you want a manual
#     approval before anything is published).
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: tag is on main and versions match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; releases are cut from main only"
            exit 1
          fi
      - name: Every version in the repo must equal the tag
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

  test:
    name: tests
    needs: verify
    uses: ./.github/workflows/ci.yml

  build-sdist:
    name: build sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: python/dist

  build-wheels:
    name: wheel (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --locked --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist

  # Everything above must succeed before anything is published, so a broken wheel cannot leave
  # crates.io published and PyPI not.
  publish-crates:
    name: publish to crates.io
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order, skipping versions that are already up
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in distlock-proto distlock-core distlock-client distlock-server; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'distlock-release-workflow' \
              "https://crates.io/api/v1/crates/$crate/$version")"
            if [ "$status" = 200 ]; then
              echo "$crate $version is already on crates.io; skipping"
              continue
            fi
            # cargo waits until the new version is visible in the index before returning,
            # so the next crate (which depends on it) can be published straight away.
            cargo publish -p "$crate" --locked
          done

  publish-pypi:
    name: publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
