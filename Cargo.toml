[workspace]
resolver = "3"
members = ["crates/*"]
# `python/` is built by maturin and needs a Python interpreter, so it is its own workspace.
exclude = ["python"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/loggerheads-with-binary/distlock"
keywords = ["lock", "distributed", "mutex", "lease", "semaphore"]
categories = ["concurrency", "network-programming"]

[workspace.lints.rust]
unsafe_code = "forbid"
