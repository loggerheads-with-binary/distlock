[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pydistlock"
version = "0.2.0"
description = "Distributed locks (mutex, read/write, semaphore) with leases, on top of a Rust client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pydantic>=2.5,<3" , "cryptography>=50.0,<51.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/loggerheads-with-binary/distlock"

[project.optional-dependencies]
dev = ["pytest>=8" , "maturin>=1.7,<2.0"]

[tool.maturin]
# The pure-Python package is ./distlock; the compiled module is distlock._native.
module-name = "distlock._native"
python-source = "."
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
