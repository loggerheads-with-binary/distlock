[package]
name = "distlock-py"
version = "0.3.0"
edition = "2024"
publish = false
description = "Python bindings for distlock-client"
license = "MIT"
repository = "https://github.com/loggerheads-with-binary/distlock"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
distlock-client = { version = "0.3.0", path = "../crates/distlock-client", default-features = false }
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync"] }

# Not part of the root workspace: building it needs a Python interpreter, which the pure-Rust
# crates (and CI for them) should not.
[workspace]
