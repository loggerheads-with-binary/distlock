[package]
name = "distlock-client"
description = "Async and blocking client for the distlock server"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "distlock-health"
path = "src/bin/distlock-health/main.rs"
required-features = ["cli"]

[[test]]
name = "health_cli"
required-features = ["cli"]

[features]
default = ["cli"]
# The `distlock-health` tool: health checks (HTTP webhooks need `ureq`), users reset, certificate and
# key generation. Library users can opt out with `default-features = false`.
cli = ["dep:clap", "dep:rcgen", "dep:serde_json", "dep:time", "dep:ureq", "dep:x509-parser"]

[dependencies]
bytes = "1.12.2"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"], optional = true }
distlock-proto = { version = "0.4.0", path = "../distlock-proto" }
futures-util = { version = "0.3.34", features = ["sink"] }
getrandom = "0.4.3"
prost = "0.14.6"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"], optional = true }
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
rustls-webpki = { version = "0.103.17", default-features = false, features = ["ring", "std"] }
serde_json = { version = "1.0.154", optional = true }
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
time = { version = "0.3", default-features = false, features = ["std", "parsing"], optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"], optional = true }
webpki-roots = "1.0.12"
x509-parser = { version = "0.18", optional = true }

[dev-dependencies]
bcrypt = "0.19.3"
distlock-server = { path = "../distlock-server" }
md-5 = "0.11.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
