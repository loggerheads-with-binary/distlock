[package]
name = "distlock-client"
description = "Async and blocking client for the distlock server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.2"
distlock-proto = { version = "0.1.0", path = "../distlock-proto" }
futures-util = { version = "0.3.34", features = ["sink"] }
getrandom = "0.4.3"
prost = "0.14.6"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"

[dev-dependencies]
bcrypt = "0.19.3"
distlock-server = { path = "../distlock-server" }
serde_json = "1.0.154"
tempfile = "3.27.0"
