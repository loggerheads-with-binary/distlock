[package]
name = "distlock-server"
description = "TCP lock server for distlock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
arc-swap = "1.9.5"
bcrypt = "0.19.3"
bytes = "1.12.2"
distlock-core = { version = "0.1.0", path = "../distlock-core" }
distlock-proto = { version = "0.1.0", path = "../distlock-proto" }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", features = ["sink"] }
getrandom = "0.4.3"
prost = "0.14.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3.27.0"
