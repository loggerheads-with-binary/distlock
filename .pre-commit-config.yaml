# Install once:  pip install pre-commit && pre-commit install
# Run on everything:  pre-commit run --all-files
# Production code only: tests (python/tests, Rust --all-targets) are left to CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        files: ^python/distlock/
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace --locked
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --locked -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-check-python-ext
        name: cargo check (python extension)
        entry: cargo check --manifest-path python/Cargo.toml --locked
        language: system
        files: ^python/(src/|Cargo\.(toml|lock))
        pass_filenames: false
